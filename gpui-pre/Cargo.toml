# Git patch packages for applications using the gpui-pre 0.3.14 snapshot.
# Library targets compile the canonical Zed sources in ../../crates.
[workspace]
members = ["linux", "platform", "wgpu"]
resolver = "2"

[workspace.lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
style = { level = "allow", priority = -1 }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", priority = 0 }

# The published web adapter also depends on gpui-pre-wgpu. Standalone checks
# should resolve the same package graph as downstream applications patching
# all three adapters, including on non-Linux targets.
[patch.crates-io]
gpui-pre-linux = { path = "linux" }
gpui-pre-platform = { path = "platform" }
gpui-pre-wgpu = { path = "wgpu" }
