# Dependency names and versions follow the published gpui-pre 0.3.7 manifests.
[package]
name = "gpui-pre-wgpu"
version = "0.3.7"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Zed wgpu backend for gpui-pre 0.3.7 with Wayland image capture"

[package.metadata.gpui-pre]
zed-crate = "gpui_wgpu"
# Published dependencies originate from this snapshot; library sources use this branch.
dependency-snapshot-rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b"

[lib]
name = "gpui_wgpu"
path = "../../crates/gpui_wgpu/src/gpui_wgpu.rs"
doctest = false

[features]
default = []
bench-support = ["gpui/bench-support", "dep:image"]
font-kit = ["dep:font-kit"]
test-support = ["gpui/test-support", "dep:image"]

[dependencies]
anyhow = { version = "1.0.86" }
bytemuck = { version = "1" }
collections = { version = "=0.3.7", package = "gpui-pre-collections" }
cosmic-text = { version = "0.19.0" }
etagere = { version = "0.2" }
font-kit = { version = "0.14.1-zed", optional = true, package = "zed-font-kit" }
gpui = { version = "=0.3.7", default-features = false, package = "gpui-pre" }
gpui_util = { version = "=0.3.7", package = "gpui-pre-util" }
image = { version = "0.25.1", features = [
  "bmp",
  "dds",
  "exr",
  "ff",
  "gif",
  "hdr",
  "ico",
  "jpeg",
  "png",
  "pnm",
  "qoi",
  "rayon",
  "tga",
  "tiff",
  "webp",
], optional = true, default-features = false }
itertools = { version = "0.14.0" }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = { version = "0.12.1" }
profiling = { version = "1" }
raw-window-handle = { version = "0.6" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = { version = "0.2.6" }
unicode-bidi = { version = "0.3.18", features = [
  "hardcoded-data",
], default-features = false }
unicode-segmentation = { version = "1.10" }
wgpu = { version = "29.0.4" }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "29.0.4", features = ["webgl"] }

[lints]
workspace = true
