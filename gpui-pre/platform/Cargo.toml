[package]
edition = "2024"
name = "gpui-pre-platform"
version = "0.3.11"
build = false
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Zed platform backend with Linux window capture for gpui-pre 0.3.11"
readme = false
license = "Apache-2.0"
repository = "https://github.com/zed-industries/zed"
resolver = "2"

[package.metadata.gpui-pre]
zed-crate = "gpui_platform"
zed-version = "0.1.0"
zed-rev = "784374c679"

[features]
bench-support = [
    "gpui/bench-support",
    "gpui_macos/bench-support",
    "gpui_wgpu/bench-support",
]
default = ["multithreaded"]
font-kit = ["gpui_macos/font-kit"]
inspector = ["gpui/inspector"]
multithreaded = ["gpui_web/multithreaded"]
runtime_shaders = [
    "gpui_macos/runtime_shaders",
    "gpui_ios/runtime_shaders",
]
screen-capture = [
    "gpui/screen-capture",
    "gpui_macos/screen-capture",
    "gpui_windows/screen-capture",
    "gpui_linux/screen-capture",
]
test-support = [
    "gpui/test-support",
    "gpui_macos/test-support",
    "gpui_windows/test-support",
    "gpui_wgpu/test-support",
    "gpui_linux/test-support",
]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]

[lib]
name = "gpui_platform"
path = "../../crates/gpui_platform/src/gpui_platform.rs"
doctest = false

[[bench]]
name = "atlas_upload"
path = "benches/atlas_upload.rs"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "inspector_render"
path = "benches/inspector_render.rs"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "randomized_element_tree"
path = "benches/randomized_element_tree.rs"
harness = false
required-features = ["bench-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.gpui]
version = "=0.3.11"
default-features = false
package = "gpui-pre"

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies.gpui_linux]
path = "../linux"
version = "=0.3.11"
default-features = false
package = "gpui-pre-linux"

[target.'cfg(target_family = "wasm")'.dependencies.console_error_panic_hook]
version = "0.1.7"

[target.'cfg(target_family = "wasm")'.dependencies.gpui_web]
version = "=0.3.11"
default-features = false
package = "gpui-pre-web"

[target.'cfg(target_os = "ios")'.dependencies.gpui_ios]
version = "=0.3.11"
package = "gpui-pre-ios"

[target.'cfg(target_os = "linux")'.dependencies.gpui_wgpu]
path = "../wgpu"
version = "=0.3.11"
optional = true
package = "gpui-pre-wgpu"

[target.'cfg(target_os = "macos")'.dependencies.gpui_macos]
version = "=0.3.11"
default-features = false
package = "gpui-pre-macos"

[target.'cfg(target_os = "windows")'.dependencies.gpui]
version = "=0.3.11"
features = ["windows-manifest"]
default-features = false
package = "gpui-pre"

[target.'cfg(target_os = "windows")'.dependencies.gpui_windows]
version = "=0.3.11"
default-features = false
package = "gpui-pre-windows"

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
