# The upstream workflows use organization-only runners. Keep the fork's stable
# Rust validation independent so changes receive executable checks here.
name: Fork Rust
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-rust-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
jobs:
  format:
    if: github.repository == 'stayhydated/zed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo metadata --locked --no-deps --format-version 1
  workspace:
    if: github.repository == 'stayhydated/zed'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - run: ./script/linux
      - run: ./script/download-wasi-sdk
      - run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          cache-on-failure: true
      - run: |
          mkdir -p ../.cargo
          cp .cargo/ci-config.toml ../.cargo/config.toml
      - run: GITHUB_ACTIONS=1 ./script/clippy --locked
  gpui:
    if: github.repository == 'stayhydated/zed'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ZED_HEADLESS: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - if: runner.os == 'Linux'
        run: ./script/linux
      - run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          cache-on-failure: true
      - run: |
          mkdir -p ../.cargo
          cp .cargo/ci-config.toml ../.cargo/config.toml
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest
      - run: cargo nextest run --locked --release -p gpui -p util --all-features --lib --no-fail-fast --no-tests=warn
      - run: cargo test --locked --release -p gpui -p util --all-features --doc
      - run: GITHUB_ACTIONS=1 ./script/clippy --locked -p gpui -p util -p gpui_platform
  web:
    if: github.repository == 'stayhydated/zed'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          cache-on-failure: true
      - run: cargo --config .cargo/ci-config.toml check --locked -p gpui --target wasm32-unknown-unknown --no-default-features --lib
  nix:
    if: github.repository == 'stayhydated/zed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix eval --raw .#packages.x86_64-linux.default.drvPath
