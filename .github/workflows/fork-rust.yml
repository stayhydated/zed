# The upstream workflows use organization-only runners. Keep the fork's stable
# Rust validation independent so changes receive executable checks here.
name: Fork Rust
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-rust-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
jobs:
  format:
    if: github.repository == 'stayhydated/zed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo metadata --locked --no-deps --format-version 1
  workspace:
    if: github.repository == 'stayhydated/zed'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - run: ./script/linux
      - run: ./script/download-wasi-sdk
      - run: rustup show
      - run: |
          mkdir -p ../.cargo
          cp .cargo/ci-config.toml ../.cargo/config.toml
      - run: GITHUB_ACTIONS=1 ./script/clippy --locked
  gpui:
    if: github.repository == 'stayhydated/zed'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ZED_HEADLESS: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - if: runner.os == 'Linux'
        run: ./script/linux
      - run: rustup show
      - run: |
          mkdir -p ../.cargo
          cp .cargo/ci-config.toml ../.cargo/config.toml
      - run: cargo test --locked --release -p gpui -p util --all-features --lib
      - run: cargo test --locked --release -p util --doc
      - run: GITHUB_ACTIONS=1 ./script/clippy --locked -p gpui -p util -p gpui_platform
